[tox]
envlist = py3
isolated_build = true

[testenv]
description =
  Run unit tests.
extras =
  test
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  PYTHONDONTWRITEBYTECODE=1
  PIP_CONSTRAINT={toxinidir}/tools/pinned-requirements.txt
passenv =
  OVF_UPDATE_EXPECTED
commands =
  stestr run {posargs}
