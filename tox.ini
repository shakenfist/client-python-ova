[tox]
envlist = py3
isolated_build = true

[testenv]
description =
  Run unit tests.
extras =
  test
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  PYTHONDONTWRITEBYTECODE=1
passenv =
  OVF_UPDATE_EXPECTED
commands =
  stestr run {posargs}

[testenv:descriptor-corpus]
description =
  Run the descriptor corpus tier. Needs the network: fetches two upstream
  descriptor collections, at pinned commits, into .cache/ovf-corpora.
allowlist_externals =
  {toxinidir}/tools/fetch-descriptor-corpus.sh
commands =
  {toxinidir}/tools/fetch-descriptor-corpus.sh
  stestr --test-path ./shakenfist_client_ova/corpus_tests run {posargs}

[testenv:appliance-corpus]
description =
  Run the appliance corpus tier. Needs APPLIANCE_CORPUS set to the
  downloaded/ova directory of an instar-testdata checkout with its LFS
  files pulled, and fails without one.
passenv =
  APPLIANCE_CORPUS
commands =
  stestr --test-path ./shakenfist_client_ova/appliance_tests run {posargs}
