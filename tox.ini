[tox]
envlist = py3
isolated_build = true

[testenv]
description =
  Run unit tests.
extras =
  test
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  PYTHONDONTWRITEBYTECODE=1
  PIP_CONSTRAINT={toxinidir}/tools/pinned-requirements.txt
passenv =
  OVF_UPDATE_EXPECTED
commands =
  stestr run {posargs}

[testenv:descriptor-corpus]
description =
  Run the descriptor corpus tier. Needs the network: fetches two upstream
  descriptor collections, at pinned commits, into .cache/ovf-corpora.
allowlist_externals =
  {toxinidir}/tools/fetch-descriptor-corpus.sh
commands =
  {toxinidir}/tools/fetch-descriptor-corpus.sh
  stestr --test-path ./shakenfist_client_ova/corpus_tests run {posargs}
