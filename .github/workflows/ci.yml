# CI for the OVA client plugin.
#
# Three jobs, because there are three kinds of work with different
# needs: lint-and-build is the pre-commit hooks, the unit tests and a
# package build, which need nothing but the repository; descriptor-corpus
# runs the test tier that fetches two upstream descriptor collections
# over the network, which is slower and can fail for reasons outside the
# change, so it reports separately; appliance-corpus runs the tier over
# private appliances, which needs a secret and a runner carrying the
# test data, and is described where it is defined. The first two run on
# a static runner -- nothing in them installs an OS package or otherwise
# changes the machine, so nothing needs a throwaway VM.
#
# That argument is about cost, not safety. Everything below executes
# code the pull request controls: pre-commit runs the hooks its own
# config names, tox runs its test code, and the build runs the pull
# request's packaging. The static pool is persistent, so on a fork pull
# request that would be a foothold on a shared machine. What makes it
# acceptable is a repository setting rather than anything in this file
# -- Settings > Actions requires approval for all external
# contributors, so a fork's workflows do not run until a maintainer has
# looked. If that setting is ever relaxed, these jobs belong on the
# throwaway vm pool, as secret-scan.yml already is. That setting does
# not cover merge queue runs: enqueueing a fork's pull request runs its
# version of this file, and of tools/ci/, with this repository's
# secrets. For a merge queue entry, enqueueing is the approval.
name: CI

on:
  pull_request:
    branches: [develop]
  # Merges go through a merge queue, so every commit that lands on
  # develop is the commit a merge_group run tested, even when its base
  # moved after the pull request run. That run is the one release.yml's
  # CI gate counts, which is why there is no push trigger: it would
  # only test the same commit a second time. "Can enqueue" and "Can
  # merge" below are the checks the queue's ruleset requires.
  merge_group:
  # pr-retest.yml re-runs this workflow by dispatching it, through the
  # RETEST_WORKFLOW repository variable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-and-build
      cancel-in-progress: true

    steps:
      # fetch-depth: 0 so setuptools_scm can derive the version from the
      # most recent v* tag when the package is built.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A venv because the runners enforce PEP 668. Under $RUNNER_TEMP
      # rather than a fixed /tmp path because the static pool is shared
      # and long lived, and two runs can be in flight at once: with a
      # constant path one run's cleanup deletes a venv another is still
      # using. $RUNNER_TEMP is per runner, and a runner takes one job at
      # a time.
      - name: Install pre-commit, build and tox
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-ci"
          "${RUNNER_TEMP}/venv-ci/bin/pip" install --quiet \
              --disable-pip-version-check pre-commit build tox

      # On PATH rather than called by absolute path, so the steps below
      # read as the commands a developer runs locally, and so the
      # llm-context-lint-ci audit sees a literal `pre-commit run`.
      - name: Put the venv on PATH
        run: echo "${RUNNER_TEMP}/venv-ci/bin" >> "${GITHUB_PATH}"

      # Running the config rather than naming the tools means a hook
      # added later is picked up without editing this file.
      - name: Run the pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Run the unit tests
        run: |
          tox -epy3

      # The appliance corpus job's fetch script holds a credential, and
      # its input guards are what stop it running somewhere it should
      # not. They are tested here rather than in that job, because that
      # job does not run for forks and these tests need nothing private.
      - name: Test the appliance corpus fetch script's guards
        run: |
          tools/ci/test-fetch-appliance-corpus.sh

      - name: Build the sdist and wheel
        run: |
          python3 -m build --outdir "${RUNNER_TEMP}/dist" .

      # The same wheel check release.yml runs before publishing, here so
      # that a packaging change which would ship the tests fails on its
      # pull request rather than at release time.
      - name: Check the wheel contents
        timeout-minutes: 2
        uses: shakenfist/actions/check-dist@main
        with:
          path: ${{ runner.temp }}/dist

      - name: Clean up
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/venv-ci" "${RUNNER_TEMP}/dist"

  descriptor-corpus:
    name: Descriptor corpus
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-descriptor-corpus
      cancel-in-progress: true

    steps:
      # fetch-depth: 0 so setuptools_scm can derive the version when tox
      # builds the package.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A venv under $RUNNER_TEMP for the reasons given in lint-and-build,
      # with its own name so the two jobs never share a path.
      - name: Install tox
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-corpus"
          "${RUNNER_TEMP}/venv-corpus/bin/pip" install --quiet \
              --disable-pip-version-check tox

      - name: Put the venv on PATH
        run: echo "${RUNNER_TEMP}/venv-corpus/bin" >> "${GITHUB_PATH}"

      # This fetches two upstream descriptor collections from github.com
      # at pinned commits, about 30MB. actions/checkout's clean removes
      # the gitignored cache, so each run fetches afresh. That is
      # accepted rather than cached.
      - name: Run the descriptor corpus tests
        run: |
          tox -edescriptor-corpus

      - name: Clean up
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/venv-corpus"

  # The appliance corpus: every OVA in the private instar-testdata
  # repository's downloaded/ova/, opened and checked by
  # tox -eappliance-corpus. Fetching it needs a GitLab token, which makes
  # this the one job here that holds a secret, and the shape of the job
  # follows from keeping that secret away from code it was not meant for.
  #
  # The `if:` keeps fork pull requests out. GitHub gives a fork's run no
  # secrets, so the job could only fail there; skipping it says so
  # honestly instead. It does not soften the test: inside the job, a
  # missing or incomplete corpus fails. What reaches the job is a pull
  # request from a branch of this repository (Renovate's included), a
  # merge queue entry, and a dispatch (pr-retest.yml)
  # -- all code from a branch someone with write access controls. A
  # merge queue entry can carry a fork's change, but only once someone
  # with write access has put it in the queue. That person can read the
  # token, through the fetch script on their own branch; that is
  # accepted, because the token is read-only and reaches one repository
  # of test data.
  #
  # Within the job, the secret is in the environment of one step, the
  # fetch, which runs before anything is installed. Every later step
  # runs code this repository does not control -- pip's downloads, tox,
  # and whatever a Renovate branch has just bumped -- and none of them
  # can read a secret that was never in their environment. The fetch
  # script also leaves nothing on disk for them to find: the token goes
  # to git as a header, and the script fails if it can find the token
  # under the testdata tree's .git afterwards. That confinement assumes
  # the runner and its testdata disk are not shared with less-trusted
  # jobs; as a check on the disk, the script refuses a tree whose
  # repository configuration carries keys a clone does not.
  #
  # The `instar` label is what promises the runner fleet's pre-built
  # testdata disk; the script updates that tree in place rather than
  # cloning, and fails if it is missing.
  appliance-corpus:
    name: Appliance corpus
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, debian-13, xl, instar]
    permissions:
      contents: read
    # 30 minutes, against the other jobs' 15: on a disk built before the
    # corpus last changed, the fetch can pull most of its 2GB of LFS
    # objects, and the test then hashes every disk in every appliance.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-appliance-corpus
      cancel-in-progress: true

    steps:
      # fetch-depth: 0 so setuptools_scm can derive the version when tox
      # builds the package; it runs git describe on local tags, so no
      # later step needs the GITHUB_TOKEN. persist-credentials: false
      # because this job runs branch code on a runner that holds the
      # testdata credential for one step, so the GITHUB_TOKEN need not
      # sit in .git/config either. This job is the one holding a secret,
      # so its one action is pinned to a commit rather than a movable
      # tag; Renovate keeps the digest current.
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The only step that sees the secret; see the comment on the job.
      # TESTDATA_USER is a repository variable, not a secret, because a
      # username is not one; the script defaults it when it is unset.
      # The script writes APPLIANCE_CORPUS to $GITHUB_ENV for the tox
      # step.
      - name: Fetch the appliance corpus
        env:
          TESTDATA_TOKEN: ${{ secrets.GITLAB_TESTDATA_TOKEN }}
          TESTDATA_USER: ${{ vars.GITLAB_TESTDATA_USER }}
        run: |
          tools/ci/fetch-appliance-corpus.sh

      # A venv under $RUNNER_TEMP for the reasons given in lint-and-build,
      # with its own name so no two jobs share a path.
      - name: Install tox
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-appliance"
          "${RUNNER_TEMP}/venv-appliance/bin/pip" install --quiet \
              --disable-pip-version-check tox

      - name: Put the venv on PATH
        run: echo "${RUNNER_TEMP}/venv-appliance/bin" >> "${GITHUB_PATH}"

      - name: Run the appliance corpus tests
        run: |
          tox -eappliance-corpus

      - name: Clean up
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/venv-appliance"

  # The automatic review, gated on lint-and-build and descriptor-corpus
  # passing: a job skipped because a dependency failed never starts the
  # reusable workflow, so the needs list is the CI-passed gate.
  # appliance-corpus is left out of it because it is skipped for fork
  # pull requests, and a skipped dependency would skip the review too.
  #
  # The permissions block has to be here rather than in the reusable
  # workflow, because a cross-repository reusable workflow cannot grant
  # itself more token scope than its caller has. Deliberately no
  # `secrets: inherit`: nothing in the reviewer chain reads a secret.
  # The reusable workflow's own job is conditioned on the event being a
  # pull request, so merge queue and dispatch runs skip it.
  automated_reviewer:
    name: "Automated reviewer"
    needs: [lint-and-build, descriptor-corpus]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main

  # The two checks the merge queue's ruleset requires, collecting this
  # workflow's jobs into one result each, in the shape described at
  # https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
  # "Can enqueue" reports on pull requests and "Can merge" on merge
  # queue entries; each is skipped, which GitHub treats as success, on
  # the other event. "Can enqueue" counts a skipped appliance-corpus as
  # passed, which is what lets a fork pull request, whose
  # appliance-corpus job is skipped, be enqueued. "Can merge" does not: on a merge queue entry
  # every job runs, and must succeed. The
  # automated reviewer is advisory and deliberately not in needs: it
  # must not be able to block a merge on an API hiccup.
  can-enqueue:
    name: "Can enqueue"
    needs:
      - lint-and-build
      - descriptor-corpus
      - appliance-corpus
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    # The steps read only the needs context, so the token needs nothing.
    permissions: {}
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      # appliance-corpus, and only appliance-corpus, may be skipped here:
      # it is skipped on a fork pull request. Any other skipped job fails.
      - name: Transform outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ALL_SUCCESS=$(echo "${NEEDS_JSON}" | jq 'to_entries | map(.value.result == "success" or (.key == "appliance-corpus" and .value.result == "skipped")) | all')" >> "${GITHUB_ENV}"
      - name: Check outcomes
        run: |
          [ "${ALL_SUCCESS}" == true ]

  can-merge:
    name: "Can merge"
    needs:
      - lint-and-build
      - descriptor-corpus
      - appliance-corpus
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    # The steps read only the needs context, so the token needs nothing.
    permissions: {}
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      # Every need must succeed: on a merge queue entry every job is meant
      # to run, and this run is the one release.yml's CI gate counts. A
      # job that skipped here would let an untested tier reach a release.
      - name: Transform outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ALL_SUCCESS=$(echo "${NEEDS_JSON}" | jq '. | to_entries | map(.value.result == "success") | all')" >> "${GITHUB_ENV}"
      - name: Check outcomes
        run: |
          [ "${ALL_SUCCESS}" == true ]
