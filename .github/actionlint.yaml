# Configuration for actionlint
# https://github.com/rhysd/actionlint/blob/main/docs/config.md

self-hosted-runner:
  # Custom labels used by our self-hosted runners
  labels:
    - claude-code
    - debian-13
    # A runner carrying the fleet's pre-built instar-testdata disk, which
    # the appliance corpus job reads. actionlint rejects an unknown
    # self-hosted label, so it has to be listed before a job can name it.
    - instar
    - static
    - vm
    - s
    - xl
